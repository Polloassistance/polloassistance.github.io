<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollo Assistance Wiki</title>
    <meta name="description" content="Official Pollo Assistance documentation: guides, modules, pricing and everything you need to know about the AI ecosystem.">
    <link rel="icon" type="image/png" href="logo.png">
    <!-- F.7 — Router de idioma. La wiki vive en /wiki/en/ y /wiki/es/.
         Este archivo decide a cuál mandar al usuario:
           1. Si hay preferencia guardada (localStorage 'wiki_lang') → la usa.
           2. Si no, lee navigator.language. 'es-*' → /es/, cualquier otro → /en/.
         La preferencia se actualiza cada vez que el user usa el selector
         de idioma en una página de la wiki. -->
    <script>
    (function () {
        try {
            var stored = localStorage.getItem('wiki_lang');
            var supported = { en: 1, es: 1 };
            var lang;
            if (stored && supported[stored]) {
                lang = stored;
            } else {
                var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                lang = nav.indexOf('es') === 0 ? 'es' : 'en';
            }
            // Mantener hash y query string si los hay (ej. ?ref=email#section1)
            var search = location.search || '';
            var hash   = location.hash || '';
            location.replace('./' + lang + '/' + search + hash);
        } catch (e) {
            // localStorage bloqueado (modo privado estricto, etc.) → fallback EN
            location.replace('./en/');
        }
    })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
               background:#0d1117; color:#c9d1d9; margin:0;
               display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .loader { text-align:center; }
        .loader img { width:48px; height:48px; border-radius:10px; margin-bottom:14px; }
        .loader p { font-size:13px; color:#8b949e; margin:6px 0; }
        .loader .small { font-size:11px; color:#6e7681; }
        .loader a { color:#FF9800; text-decoration:none; }
        .spinner {
            width:28px; height:28px; border:3px solid rgba(255,152,0,0.2);
            border-top-color:#FF9800; border-radius:50%;
            animation:spin 0.8s linear infinite;
            margin:0 auto 14px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Fallback visual mientras el redirect se ejecuta (debería ser instantáneo).
         Si JS está deshabilitado, el user ve estos enlaces manuales. -->
    <div class="loader">
        <div class="spinner"></div>
        <p><strong>Pollo Assistance Wiki</strong></p>
        <p>Loading… · Cargando…</p>
        <p class="small">
            <a href="./en/">🇬🇧 English</a> &nbsp;·&nbsp;
            <a href="./es/">🇪🇸 Español</a>
        </p>
    </div>
</body>
</html>
